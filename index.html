<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha de Cadastro</title>
  <!-- Tailwind CSS para visual moderno -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Biblioteca para Capturar a Assinatura -->
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
  <!-- Biblioteca para Gerar o PDF no Navegador -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8">

  <div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-md" id="conteudo-pdf">
    <div class="text-center mb-6 border-b pb-4">
      <h1 class="text-2xl font-bold text-gray-800">FICHA DE CADASTRO DE CLIENTE</h1>
      <p class="text-sm text-gray-500">Preencha os dados e assine no campo indicado</p>
    </div>

    <form id="form-cadastro" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-gray-700">Nome Completo / Razão Social</label>
        <input type="text" id="nome" required class="mt-1 block w-full border border-gray-300 rounded-md p-2 text-sm focus:ring-2 focus:ring-blue-500">
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700">CPF / CNPJ</label>
          <input type="text" id="documento" required class="mt-1 block w-full border border-gray-300 rounded-md p-2 text-sm">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700">Telefone / WhatsApp</label>
          <input type="tel" id="telefone" required class="mt-1 block w-full border border-gray-300 rounded-md p-2 text-sm">
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700">E-mail</label>
        <input type="email" id="email" required class="mt-1 block w-full border border-gray-300 rounded-md p-2 text-sm">
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700">Endereço Completo</label>
        <input type="text" id="endereco" required class="mt-1 block w-full border border-gray-300 rounded-md p-2 text-sm">
      </div>

      <!-- Área de Assinatura -->
      <div class="pt-4">
        <label class="block text-sm font-semibold text-gray-700 mb-1">Assinatura Digital (Assine na caixa abaixo):</label>
        <div class="border-2 border-dashed border-gray-400 rounded-md bg-gray-50">
          <canvas id="canvas-assinatura" class="w-full h-36 touch-none cursor-crosshair"></canvas>
        </div>
        <button type="button" id="btn-limpar" class="mt-1 text-xs text-red-600 hover:underline">Limpar Assinatura</button>
      </div>
    </form>
  </div>

  <!-- Botão de Ação -->
  <div class="max-w-2xl mx-auto mt-6 text-center">
    <button id="btn-gerar-pdf" type="button" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg shadow-lg transition duration-200">
      Gerar e Baixar Ficha em PDF
    </button>
  </div>

  <script>
    // Configura o SignaturePad
    const canvas = document.getElementById('canvas-assinatura');
    const signaturePad = new SignaturePad(canvas, { backgroundColor: 'rgba(255, 255, 255, 0)' });

    function resizeCanvas() {
      const ratio = Math.max(window.devicePixelRatio || 1, 1);
      canvas.width = canvas.offsetWidth * ratio;
      canvas.height = canvas.offsetHeight * ratio;
      canvas.getContext("2d").scale(ratio, ratio);
      signaturePad.clear();
    }
    
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    document.getElementById('btn-limpar').addEventListener('click', () => signaturePad.clear());

    // Ação de Gerar o PDF
    document.getElementById('btn-gerar-pdf').addEventListener('click', () => {
      const nome = document.getElementById('nome').value;
      if (!nome) {
        alert("Por favor, preencha pelo menos o Nome Completo.");
        return;
      }

      if (signaturePad.isEmpty()) {
        alert("Por favor, faça sua assinatura antes de gerar o PDF.");
        return;
      }

      const elemento = document.getElementById('conteudo-pdf');
      const nomeArquivo = `Ficha_Cadastro_${nome.trim().replace(/\s+/g, '_')}.pdf`;

      const opcoes = {
        margin:       [10, 10, 10, 10],
        filename:     nomeArquivo,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, logging: false },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opcoes).from(elemento).save();
    });
  </script>
</body>
</html>
